<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinWise — AI-Powered Financial Wellness for Young Adults</title>
  <meta name="description" content="Take control of your money with AI. Track expenses, predict future spending, and reach savings goals with zero judgment." />
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Prop Types & Recharts UMD -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>

  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>

  <!-- Application Scripts -->
  <script src="js/mockData.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/exportHelper.js"></script>
  
  <!-- Babel JSX Components -->
  <script type="text/babel" src="js/components/LandingPage.jsx"></script>
  <script type="text/babel" src="js/components/Dashboard.jsx"></script>
  <script type="text/babel" src="js/components/ExpenseTracker.jsx"></script>
  <script type="text/babel" src="js/components/Predictions.jsx"></script>
  <script type="text/babel" src="js/components/SavingsGoals.jsx"></script>
  <script type="text/babel" src="js/components/InsightsReport.jsx"></script>
  <script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
